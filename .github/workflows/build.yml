
name: Build VØIDEX

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract source archive
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$archive"
          mkdir extracted
          unzip -q "$archive" -d extracted
          build_file="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)"
          test -n "$build_file"
          echo "PROJECT_DIR=$(dirname "$build_file")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: VØIDEX-client
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          
